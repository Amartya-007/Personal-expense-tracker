<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyKhata</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--sf:#fff;--s2:#ebeaf6;--ink:#17163a;--mut:#767493;--ln:#e3e1f1;--ac:#5b3df5;--ac2:#ffb627;--on:#fff;--ex:#e5484d;--in:#12a574;--ov:rgba(15,14,40,.5);--sh:0 10px 30px rgba(40,30,120,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e1f;--sf:#181833;--s2:#222247;--ink:#f1f0fc;--mut:#9391b8;--ln:#2a2a52;--ac:#8d7bff;--ac2:#ffc247;--on:#12102e;--ex:#ff7075;--in:#4fdcab;--ov:rgba(0,0,10,.6);--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0e0e1f;--sf:#181833;--s2:#222247;--ink:#f1f0fc;--mut:#9391b8;--ln:#2a2a52;--ac:#8d7bff;--ac2:#ffc247;--on:#12102e;--ex:#ff7075;--in:#4fdcab;--ov:rgba(0,0,10,.6);--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Sora,system-ui,sans-serif;background:var(--s2);color:var(--ink);display:flex;justify-content:center;align-items:center;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
#app{width:100%;max-width:410px;height:100%;max-height:840px;background:var(--bg);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{height:min(840px,96vh);border-radius:34px;box-shadow:var(--sh)}}
#m{position:absolute;inset:0;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 130px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
#m.back{transform:translateX(-22%) scale(.97);opacity:.5}
.rise>.st{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms)}

h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px}
h3{font-size:14px;font-weight:700;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 a{font-size:12px;color:var(--ac);font-weight:600;cursor:pointer}
small,.cap{color:var(--mut);font-size:12px}.cap{display:block;margin:8px 0;line-height:1.5}
.num{font-variant-numeric:tabular-nums}.ex{color:var(--ex)}.in{color:var(--in)}
.card{background:var(--sf);border-radius:20px;padding:6px 16px;box-shadow:var(--sh)}
.hero{background:linear-gradient(140deg,var(--ac),#2d1bb0);color:#fff;border-radius:26px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
:root[data-theme=dark] .hero,:root:not([data-theme=light]) .hero{background:linear-gradient(140deg,#4a38c9,#241a78)}
.hero small{color:rgba(255,255,255,.7)}.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 14px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}

.bar i.w{background:var(--ac2)}.bar i.d{background:var(--ex)}
.bud{padding:12px 0}.bud .h{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}

.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}.seg .chip{flex:1;background:none;box-shadow:none;border-radius:11px;transform:none}.seg .chip.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}

nav button.on{color:var(--ac)}nav button.on svg{transform:translateY(-1px) scale(1.12)}
#fab{position:absolute;right:20px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:4;width:58px;height:58px;border-radius:20px;border:0;background:var(--ac2);color:#2a1d00;font-size:30px;box-shadow:0 10px 24px rgba(255,182,39,.45);transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .3s}
#fab.x{transform:rotate(135deg)}#fab.hide{transform:scale(0);opacity:0;pointer-events:none}
#fm{position:absolute;inset:0;z-index:3;background:var(--ov);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}#fm.on{opacity:1;pointer-events:auto}
.fo{position:absolute;right:20px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:10px;background:var(--sf);border:0;border-radius:18px;padding:12px 16px;font-weight:700;box-shadow:var(--sh);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:all .35s cubic-bezier(.3,1.4,.5,1);transition-delay:calc(var(--k)*40ms)}
.fo.on{opacity:1;pointer-events:auto;transform:translateY(calc(var(--k)*-62px - 72px))}
.pg{position:absolute;inset:0;background:var(--bg);z-index:6;transform:translateX(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.pg.in{transform:none}.pg.up{transform:translateY(100%)}.pg.up.in{transform:none}
.hd{display:flex;align-items:center;gap:6px;padding:14px 14px 8px}.hd b{flex:1;font-size:18px;font-weight:800}
.ib{width:40px;height:40px;border-radius:14px;border:0;background:var(--sf);font-size:20px;box-shadow:0 1px 0 var(--ln)}
.bd{flex:1;overflow-y:auto;padding:6px 18px calc(30px + env(safe-area-inset-bottom,0px))}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}.sw:last-child{border:0}
.sw .bgl,.sw .bgr{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:12px;color:#fff}
.sw .bgl{left:0;right:50%;background:var(--in)}.sw .bgr{right:0;left:50%;justify-content:flex-end;background:var(--ex)}
.sw .fg{position:relative;background:var(--sf);touch-action:pan-y;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.sw .fg .row{border:0}
.day{font-size:12px;font-weight:700;color:var(--mut);margin:18px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:2px solid transparent;border-radius:16px;padding:14px;outline:0;transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 0 var(--ln)}
input:focus,select:focus{border-color:var(--ac)}
.f{margin-bottom:16px}.f>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px 4px}
.amt{font-size:44px;font-weight:800;letter-spacing:-1px;background:none;box-shadow:none;border:0;border-bottom:3px solid var(--ln);border-radius:0;padding:6px 0}.amt:focus{border-color:var(--ac)}
.hint{font-size:12px;color:var(--ac);font-weight:600;margin:6px 0 0 4px;min-height:16px;transition:opacity .3s}
.btn{width:100%;border:0;border-radius:18px;padding:16px;background:var(--ac);color:var(--on);font-weight:800;font-size:15px;transition:transform .15s,background .3s,opacity .2s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.85}
.btn.ok{background:var(--in)}.btn.g{background:var(--s2);color:var(--ink)}.btn.r{background:none;color:var(--ex)}
.tg{width:46px;height:28px;border-radius:14px;background:var(--s2);position:relative;flex:none;transition:background .3s;cursor:pointer}.tg:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}.tg.on{background:var(--ac)}.tg.on:after{transform:translateX(18px)}
.rc{width:68px;height:68px;border-radius:16px;border:2px dashed var(--ln);display:inline-grid;place-items:center;font-size:24px;color:var(--mut);background:var(--sf);cursor:pointer;vertical-align:top;margin:0 8px 8px 0}
.th{width:68px;height:68px;border-radius:16px;display:inline-block;margin:0 8px 8px 0;position:relative;background:linear-gradient(160deg,var(--s2),var(--ln));animation:pop .4s cubic-bezier(.3,1.5,.5,1);cursor:pointer}
.th:before{content:"";position:absolute;inset:14px 14px auto;height:3px;background:var(--mut);opacity:.5;box-shadow:0 8px 0 var(--mut),0 16px 0 var(--mut),0 24px 0 var(--mut)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sheet-bg{position:absolute;inset:0;z-index:8;background:var(--ov);display:flex;align-items:flex-end;animation:fade .3s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:sup .5s cubic-bezier(.3,1.2,.5,1)}
@keyframes sup{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 16px}
.snack{position:absolute;left:14px;right:14px;bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:12;font-weight:600;animation:sup .45s cubic-bezier(.3,1.3,.5,1)}
.snack button{background:none;border:0;color:var(--ac2);font-weight:800}
.mini{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:18px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh);cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac2);margin-right:8px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,182,39,0);transform:scale(1.1)}0%{box-shadow:0 0 0 0 rgba(255,182,39,.6)}}
.cols{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:6px}.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:10.5px;color:var(--mut)}.cols i{width:100%;height:0;border-radius:8px;background:var(--ac);transition:height .9s cubic-bezier(.2,.8,.2,1)}
svg .arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}svg .ln{transition:stroke-dashoffset 1.4s ease}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .th{width:auto;aspect-ratio:1;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs .chip{flex:1;text-align:center}
.step{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:6px;margin:6px 0 24px}.dots i{height:5px;width:18px;border-radius:3px;background:var(--ln);transition:all .4s}.dots i.on{width:40px;background:var(--ac)}
.fp{width:92px;height:92px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:42px;margin:0 auto;animation:pulse 2s infinite;cursor:pointer;transition:transform .4s,background .3s}.fp.ok{background:var(--in);transform:scale(1.2)}
.map{height:110px;border-radius:18px;margin:10px 0;background:repeating-linear-gradient(35deg,var(--s2) 0 14px,var(--ln) 14px 15px),var(--s2);display:grid;place-items:center;font-size:26px}
.pb{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;width:0;background:var(--ac)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:0s!important}}
</style></head><body>
<div id="app"><div id="m"></div><div id="fm" onclick="fab(0)"></div><div id="fo"></div>
<button id="fab" aria-label="Add" onclick="fab()">+</button>
<nav id="nav"><div id="ind"></div></nav><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s),inr=n=>'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const IC={Home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',Transactions:'<path d="M4 6h16M4 12h16M4 18h10"/>',Budgets:'<circle cx="12" cy="12" r="9"/><path d="M12 12V3M12 12l6 6"/>',Insights:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',Settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const CI={Food:'🍜',Shopping:'🛍️',Bills:'🧾',Transport:'🚕',Stationery:'✏️',Electronics:'🔌',Education:'📚',Health:'💊',Income:'💰',Transfer:'⇄'};
const cats=['Food','Shopping','Bills','Transport','Stationery','Electronics','Education','Health'];
const RULES={momos:'Food',pizza:'Food',burger:'Food',chinese:'Food',pen:'Stationery',notebook:'Stationery',books:'Education',charger:'Electronics',earphones:'Electronics','screen guard':'Electronics'};
let accts=[{n:'SBI',b:42500},{n:'HDFC',b:18200}],tags=['Personal','College','Important','Travel','Monthly'];
let budgets=[{c:'Food',s:4200,l:5000},{c:'Transport',s:1800,l:3000},{c:'Shopping',s:3150,l:3500},{c:'Bills',s:2600,l:2600}];
let rec=[{n:'Netflix',v:649,f:'Monthly',due:'In 3 days'},{n:'Internet',v:799,f:'Monthly',due:'In 6 days'},{n:'Mobile recharge',v:299,f:'Monthly',due:'In 12 days'}];
let tx=[{w:'Swiggy',c:'Food',pm:'UPI',a:'SBI',v:-450,d:'Today',ago:0,sms:1,r:1},{w:'Amazon',c:'Shopping',pm:'UPI',a:'SBI',v:-1299,d:'Today',ago:0,r:1},{w:'Recharge',c:'Bills',pm:'UPI',a:'HDFC',v:-299,d:'Yesterday',ago:1},{w:'Auto ride',c:'Transport',pm:'Cash',a:'—',v:-80,d:'Yesterday',ago:1},{w:'Salary',c:'Income',pm:'Bank',a:'SBI',v:55000,d:'28 Sep',ago:4},{w:'SBI → HDFC',c:'Transfer',pm:'Bank',a:'SBI',v:-10000,d:'28 Sep',ago:4,tr:1},{w:'Notebook',c:'Stationery',pm:'Cash',a:'—',v:-120,d:'26 Sep',ago:6,r:1},{w:'Dominos',c:'Food',pm:'UPI',a:'HDFC',v:-540,d:'29 Aug',ago:34,r:1}];
tx.forEach((t,i)=>t.id=i);let nid=100;
let sms=[{w:'Zomato',v:620,pm:'UPI',a:'HDFC',st:'Successful'},{w:'IRCTC',v:1140,pm:'Debit Card',a:'SBI',st:'Successful'},{w:'Unknown',v:2300,pm:'UPI',a:'SBI',st:'Failed'}],smsDone=[],smsIgn=[];
let tab='Home',F={date:'All',pm:'All',cat:'All'},q='',smsTab='Detected',pages=[],T={};
const TABS=Object.keys(IC),nav=$('#nav');
TABS.forEach((k,i)=>{const b=document.createElement('button');b.innerHTML=`<svg viewBox="0 0 24 24">${IC[k]}</svg>${k}`;b.onclick=()=>go(k);nav.appendChild(b)});
/* effects */
function fx(r){r.querySelectorAll('.cu').forEach(e=>{const n=+e.dataset.n;if(RM){e.textContent=inr(n);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=inr(n*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)})(t0)});
requestAnimationFrame(()=>requestAnimationFrame(()=>{r.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');r.querySelectorAll('[data-h]').forEach(e=>e.style.height=e.dataset.h+'%');r.querySelectorAll('[data-d]').forEach(e=>e.style.strokeDasharray=e.dataset.d);r.querySelectorAll('[data-draw]').forEach(e=>e.style.strokeDashoffset=0)}))}
function go(t,quiet){tab=t;const m=$('#m');m.innerHTML=V[t]();m.className=(quiet?'':'rise')+(pages.length?' back':'');m.querySelectorAll('.st').forEach((e,i)=>e.style.setProperty('--i',i));if(!quiet)m.scrollTop=0;nav.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',TABS[i]===t);if(TABS[i]===t)$('#ind').style.transform=`translateX(${i*100}%)`});$('#fab').classList.toggle('hide',t!=='Home');fab(0);fx(m)}
function fab(s){const o=s===undefined?!$('#fab').classList.contains('x'):s;$('#fab').classList.toggle('x',!!o);$('#fm').classList.toggle('on',!!o);if(!$('#fo').innerHTML)$('#fo').innerHTML=[['Expense','−'],['Income','+'],['Transfer','⇄']].map((x,i)=>`<button class="fo" style="--k:${i}" onclick="fab(0);addPg('${x[0]}')"><span class="ic" style="width:30px;height:30px;font-size:15px">${x[1]}</span>${x[0]}</button>`).join('');document.querySelectorAll('.fo').forEach(e=>e.classList.toggle('on',!!o))}
/* page stack */
function pg(t,body,act='',up){return`<div class="pg ${up?'up':''}"><div class="hd"><button class="ib" onclick="pop()" aria-label="Back">${up?'✕':'‹'}</button><b>${t}</b>${act}</div><div class="bd">${body}</div></div>`}
function push(h){const d=document.createElement('div');d.innerHTML=h;const p=d.firstChild;$('#app').appendChild(p);pages.push(p);$('#m').classList.add('back');fx(p);p.offsetWidth;requestAnimationFrame(()=>p.classList.add('in'))}
function pop(){const p=pages.pop();if(!p)return;p.classList.remove('in');if(!pages.length)$('#m').classList.remove('back');setTimeout(()=>p.remove(),460);if(!pages.length)go(tab,1)}
function sheet(h){$('#ov').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSh()"><div class="sheet"><div class="grab"></div>${h}</div></div>`}
function closeSh(){const s=$('#ov');s.firstChild&&(s.firstChild.style.opacity=0,s.firstChild.style.transition='opacity .25s');setTimeout(()=>s.innerHTML='',240)}
function snack(m,u){const e=document.createElement('div');e.className='snack';e.innerHTML=`<span>${m}</span>${u?'<button>UNDO</button>':''}`;if(u)e.querySelector('button').onclick=()=>{u();e.remove()};$('#app').appendChild(e);setTimeout(()=>{e.style.transition='all .3s';e.style.opacity=0;e.style.transform='translateY(20px)';setTimeout(()=>e.remove(),300)},u?10000:2400)}
function refresh(){go(tab,1)}
function bdy(){return pages[pages.length-1].querySelector('.bd')}
/* components */
const live=()=>tx.filter(t=>!t.del);
function row(t){return`<div class="row"><span class="ic">${CI[t.c]||'•'}</span><div class="t"><b>${t.w}</b><small>${t.c} · ${t.pm}${t.sms?' · SMS':''}</small></div><b class="num ${t.tr?'':t.v<0?'ex':'in'}" style="font-size:14px">${t.v<0?'−':'+'}${inr(t.v)}</b></div>`}
function sw(t){return`<div class="sw" data-id="${t.id}"><div class="bgl">✎ Edit</div><div class="bgr">Delete 🗑</div><div class="fg">${row(t)}</div></div>`}
function bud(b,i){const p=b.s/b.l*100,k=p>=100?'d':p>=75?'w':'';return`<div class="bud" onclick="budPg(${i})" style="cursor:pointer"><div class="h"><span>${CI[b.c]} ${b.c}</span><span class="num">${inr(b.s)} / ${inr(b.l)}</span></div><div class="bar"><i class="${k}" data-w="${Math.min(p,100)}"></i></div><small>${p>=100?'Limit reached':inr(b.l-b.s)+' left'} · ${Math.round(p)}% used</small></div>`}
function chipsH(a,cur,fn){return`<div class="chips">${a.map(x=>`<button class="chip ${x===cur?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')}</div>`}
const tot=()=>accts.reduce((s,a)=>s+a.b,0);
/* tabs */
const V={Home(){return`<div class="st"><small>Good evening</small><h1 style="margin-top:2px">Amar</h1></div>

return`<div class="st" style="display:flex;justify-content:space-between;align-items:flex-start"><h1>Transactions</h1><button class="ib" onclick="delPg()" aria-label="Recently deleted">🗑</button></div><div class="st" style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="Search anything" value="${q}" oninput="q=this.value;clearTimeout(window.TT);window.TT=setTimeout(()=>{go('Transactions',1);const e=$('#q');e.focus();e.setSelectionRange(99,99)},250)"><button class="ib" style="width:52px;height:52px;border-radius:16px;position:relative" onclick="filt()">⚙${n?`<span class="dot" style="position:absolute;right:8px;top:8px;margin:0"></span>`:''}</button></div><div class="st">${chipsH(['All','This Week','This Month','Last Month'],F.date,'setD')}</div><div class="st">${h||'<p class="cap" style="padding:40px 0;text-align:center">No transactions match.<br>Change a filter or tap + on Home to add one.</p>'}</div>`},
Budgets(){const s=budgets.reduce((a,b)=>a+b.s,0),l=budgets.reduce((a,b)=>a+b.l,0),C=2*Math.PI*54,u=Math.min(s/l,1)*C;
return`<div class="st" style="display:flex;justify-content:space-between"><h1>Budgets</h1><button class="ib" onclick="newBud()" aria-label="New budget">+</button></div><div class="seg st">${['Weekly','Monthly','Yearly','Custom'].map((x,i)=>`<button class="chip ${i==1?'on':''}" onclick="this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>
<div class="card st" style="display:flex;align-items:center;gap:18px;padding:18px"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--s2)" stroke-width="11"/><circle class="arc" cx="60" cy="60" r="54" fill="none" stroke="var(--ac)" stroke-width="11" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="0 ${C}" data-d="${u} ${C}"/></svg><div><small>Left this month</small><div class="num cu" data-n="${l-s}" style="font-size:26px;font-weight:800">0</div><small>of ${inr(l)} budgeted</small></div></div>
<h3 class="st">Categories</h3><div class="card st">${budgets.map(bud).join('')||'<p class="cap" style="padding:20px 0">No budgets yet. Create a budget to start tracking spending.</p>'}</div><p class="cap st">Alerts fire at 75%, 90% and 100%, once per period.</p>`},
Insights(){const d=[['Food',4200,'#ff8a5b'],['Shopping',3150,'#7c8cff'],['Bills',2600,'#46d6a4'],['Transport',1800,'#ffb627'],['Other',900,'#c77dff']],T0=12650,C=2*Math.PI*52;let c=0;
const arcs=d.map(x=>{const l=x[1]/T0*C-3,o=-c;c+=x[1]/T0*C;return`<circle class="arc" cx="70" cy="70" r="52" fill="none" stroke="${x[2]}" stroke-width="18" transform="rotate(-90 70 70)" stroke-dasharray="0 ${C}" stroke-dashoffset="${o}" data-d="${l} ${C}"/>`}).join('');
const pts=[30,55,40,70,52,85,60,48],path=pts.map((y,i)=>`${i?'L':'M'}${i*42+8} ${100-y}`).join(' ');
return`<h1 class="st">Insights</h1><div class="st">${chipsH(['Today','This Week','This Month','Last Month','Custom'],'This Month','toast')}</div>
<div class="card st" style="padding:18px"><b>Spending by category</b><div style="display:flex;align-items:center;gap:16px;margin-top:10px"><svg width="140" height="140" viewBox="0 0 140 140">${arcs}<text x="70" y="68" text-anchor="middle" fill="var(--mut)" font-size="10" font-family="Sora">Spent</text><text x="70" y="86" text-anchor="middle" fill="var(--ink)" font-size="16" font-weight="800" font-family="Sora">₹12.6k</text></svg><div style="flex:1">${d.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px"><i style="width:9px;height:9px;border-radius:3px;background:${x[2]}"></i><span style="flex:1">${x[0]}</span><b class="num">${inr(x[1])}</b></div>`).join('')}</div></div></div>
<h3 class="st">Income vs expense</h3><div class="card st"><div class="bud"><div class="h"><span>Income</span><b class="num in">₹55,000</b></div><div class="bar"><i data-w="100" style="background:var(--in)"></i></div></div><div class="bud"><div class="h"><span>Expense</span><b class="num ex">₹12,650</b></div><div class="bar"><i data-w="23" style="background:var(--ex)"></i></div></div></div>
<h3 class="st">Spending trend</h3><div class="card st" style="padding:16px"><svg viewBox="0 0 304 110" width="100%"><path class="ln" d="${path}" fill="none" stroke="var(--ac)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" data-draw="1"/></svg><div style="display:flex;justify-content:space-between"><small>Wk 1</small><small>Wk 8</small></div></div>
<h3 class="st">By payment method</h3><div class="card st"><div class="cols">${[['UPI',78],['Cash',16],['Card',7]].map(x=>`<div><i data-h="${x[1]}"></i>${x[0]}</div>`).join('')}</div></div>
<h3 class="st">By account</h3><div class="card st"><div class="row"><div class="t"><b>SBI</b></div><b class="num">₹8,420</b></div><div class="row"><div class="t"><b>HDFC</b></div><b class="num">₹2,840</b></div><div class="row"><div class="t"><b>Cash (no account)</b></div><b class="num">₹1,390</b></div></div>
<h3 class="st">Budget utilization</h3><div class="card st">${budgets.map(bud).join('')}</div>`},
Settings(){const g=(a)=>`<div class="card st" style="margin-bottom:14px">${a.map(x=>`<div class="row" onclick="setPg('${x[1]}')"><span class="ic">${x[0]}</span><div class="t"><b>${x[1]}</b></div><span class="go">›</span></div>`).join('')}</div>`;
return`<h1 class="st">Settings</h1><div class="hero st" style="display:flex;gap:14px;align-items:center;cursor:pointer" onclick="setPg('Profile')"><span class="ic" style="background:rgba(255,255,255,.18);width:54px;height:54px;font-size:24px">A</span><div><b style="font-size:18px">Amar</b><br><small>Local profile · INR · No account needed</small></div></div>${g([['👤','Profile'],['🏦','Accounts'],['🏷','Categories'],['#️⃣','Tags']])}${g([['🔁','Recurring Payments'],['🧾','Receipts'],['💬','SMS Detection'],['📍','Location'],['🔔','Notifications']])}${g([['☁️','Backup & Restore'],['⇅','Import / Export'],['🗑','Recently Deleted'],['🔒','Security'],['🎨','Appearance'],['ℹ️','About']])}`}};
/* swipe */
document.addEventListener('pointerdown',e=>{const fg=e.target.closest('.sw .fg');if(!fg)return;let x0=e.clientX,dx=0,id=+fg.parentNode.dataset.id;fg.style.transition='none';const mv=ev=>{dx=Math.max(-130,Math.min(130,ev.clientX-x0));fg.style.transform=`translateX(${dx}px)`};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);fg.style.transition='';fg.style.transform='';if(Math.abs(dx)<6)detail(id);else if(dx>90)addPg('Expense',tx.find(t=>t.id===id));else if(dx<-90)del(id)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
function del(id){const t=tx.find(x=>x.id===id);t.del=1;refresh();snack('Transaction deleted',()=>{t.del=0;refresh()})}
function setD(x){F.date=x;go('Transactions',1)}
function filt(){const o=(k,a)=>`<h3 style="margin:14px 0 8px">${k}</h3><div class="chips" style="flex-wrap:wrap;margin:0;overflow:visible">${a.map(x=>`<button class="chip ${F[k==='Date'?'date':k==='Payment'?'pm':'cat']===x?'on':''}" onclick="F['${k==='Date'?'date':k==='Payment'?'pm':'cat'}']='${x}';filt()">${x}</button>`).join('')}</div>`;sheet(`<b style="font-size:18px">Filters</b>${o('Date',['All','Today','This Week','This Month','Last Month','Custom'])}${o('Payment',['All','UPI','Cash','Debit Card'])}${o('Category',['All',...cats])}<div style="display:flex;gap:10px;margin-top:20px"><button class="btn g" onclick="F={date:'All',pm:'All',cat:'All'};closeSh();go('Transactions',1)">Reset</button><button class="btn" onclick="closeSh();go('Transactions',1)">Show results</button></div>`)}
function toast(x){snack(x+' selected')}
/* add */
let AT='Expense',AR=0,APM='UPI';
function addPg(type,pre){AT=type;AR=0;APM='UPI';push(pg('New transaction',addBody(pre),'',1));setTimeout(()=>{const a=$('#am');a&&a.focus()},520)}
function addBody(pre){const ex=AT==='Expense',tr=AT==='Transfer',inc=AT==='Income',ac=accts.map(a=>`<option>${a.n}</option>`).join('');
return`<div class="seg">${['Expense','Income','Transfer'].map(x=>`<button class="chip ${x===AT?'on':''}" onclick="AT='${x}';bdy().innerHTML=addBody();$('#am').focus()">${x}</button>`).join('')}</div>
<div class="f"><label>Amount</label><input id="am" class="amt num" inputmode="decimal" placeholder="₹0" enterkeyhint="next" value="${pre?Math.abs(pre.v):''}" onkeydown="if(event.key==='Enter'){event.preventDefault();$('#wf').focus()}"></div>
<div class="f"><label>${tr?'From':inc?'Description':"What's it for?"}</label>${tr?`<select id="wf">${ac}</select>`:`<input id="wf" placeholder="${inc?'Salary, freelance…':'Momos, charger, pen…'}" value="${pre?pre.w:''}" oninput="sg(this.value)">`}<div class="hint" id="hn"></div></div>
<div class="f"><label>${tr?'To':'Category'}</label><select id="ct">${tr?`<option>${accts[1].n}</option><option>${accts[0].n}</option>`:(inc?['Salary','Freelance','Other income']:cats).map(c=>`<option ${pre&&pre.c===c?'selected':''}>${c}</option>`).join('')}</select></div>
${tr?'':`<div class="f"><label>Payment method</label><div class="seg" style="margin:0">${['UPI','Cash','Debit Card'].map(p=>`<button class="chip ${p===APM?'on':''}" onclick="APM='${p}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===this));$('#acf').style.display=APM==='Cash'?'none':''">${p}</button>`).join('')}</div></div><div class="f" id="acf"><label>Account</label><select id="ac">${ac}</select></div>`}
<div class="f"><label>Date</label><input type="date" id="dt"></div>
${ex?`<div class="f"><label>Note</label><input placeholder="Optional"></div><div class="f"><label>Tags</label><div class="chips" style="margin:0;flex-wrap:wrap">${tags.map((t,i)=>`<button class="chip ${i==0?'on':''}" onclick="this.classList.toggle('on')">${t}</button>`).join('')}</div></div><div class="f"><label>Location</label><div class="row" style="background:var(--sf);border-radius:16px;padding:12px 14px;border:0"><span>📍</span><small style="flex:1">Captured automatically when you save</small></div></div><div class="f"><label>Receipt</label><div id="rcs"></div><span class="rc" onclick="rcAdd()">+</span></div>`:''}
<button class="btn" id="sv" onclick="save()">Save ${AT.toLowerCase()}</button>`}
function sg(v){const k=Object.keys(RULES).find(r=>v.toLowerCase().includes(r)),h=$('#hn');if(k&&AT==='Expense'){$('#ct').value=RULES[k];h.textContent='✨ Suggested: '+RULES[k]+' · tap category to change'}else h.textContent=''}
function rcAdd(){AR++;const d=document.createElement('span');d.className='th';d.onclick=()=>d.remove();d.title='Tap to remove';$('#rcs').appendChild(d)}
setTimeout(()=>{},0);
function save(){const a=parseFloat($('#am').value);if(!a){const i=$('#am');i.style.borderColor='var(--ex)';i.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:260});return}
const b=$('#sv');b.disabled=true;b.textContent='Saving…';
setTimeout(()=>{b.classList.add('ok');b.textContent='✓ Saved';const wf=$('#wf').value,ct=$('#ct').value;let t;
if(AT==='Transfer'){const f=accts.find(x=>x.n===wf),to=accts.find(x=>x.n===ct);if(f!==to){f.b-=a;to.b+=a}t={w:wf+' → '+ct,c:'Transfer',pm:'Bank',a:wf,v:-a,tr:1}}
else{const s=AT==='Income'?1:-1,pm=AT==='Income'?'Bank':APM,an=pm==='Cash'?'—':$('#ac').value;if(pm!=='Cash')accts.find(x=>x.n===an).b+=s*a;t={w:wf||AT,c:AT==='Income'?'Income':ct,pm,a:an,v:s*a}}
Object.assign(t,{id:nid++,d:'Today',ago:0,r:AR});tx.unshift(t);setTimeout(()=>{pop();snack(AT+' added',()=>{tx.shift();refresh()})},550)},600)}
/* detail */
function detail(id){const t=tx.find(x=>x.id===id);push(pg('Details',`<div style="text-align:center;padding:10px 0 20px"><div class="ic" style="width:64px;height:64px;font-size:30px;margin:0 auto 12px;border-radius:22px">${CI[t.c]||'•'}</div><div class="num ${t.v<0?'ex':'in'}" style="font-size:40px;font-weight:800;letter-spacing:-1px">${t.v<0?'−':'+'}${inr(t.v)}</div><b>${t.w}</b></div>
<div class="card">${[['Category',t.c],['Payment method',t.pm],['Account',t.a],['Date',t.d],['Source',t.sms?'Detected from SMS':'Added manually'],['Created','Today, 6:42 pm']].map(x=>`<div class="row" style="cursor:default"><small style="width:110px">${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<h3>Location</h3><div class="map" onclick="snack('Opening your maps app')">📍</div>${t.r?`<h3>Receipts</h3>${'<span class="th" onclick="rcView()"></span>'.repeat(t.r)}`:''}
<div style="display:flex;gap:10px;margin-top:22px"><button class="btn g" onclick="pop();addPg('Expense',tx.find(x=>x.id==${id}))">Edit</button><button class="btn r" onclick="pop();del(${id})">Delete</button></div>`))}
/* accounts & budgets */
function accPg(i){const a=accts[i];push(pg(a.n,`<div class="hero"><small>Tracked balance</small><div class="big num cu" data-n="${a.b}">0</div><button class="acc" onclick="editBal(${i})">✎ Edit balance</button></div><h3>Transactions</h3><div class="card">${live().filter(t=>t.a===a.n).map(row).join('')||'<p class="cap">Nothing yet.</p>'}</div><h3>Spending this month</h3><div class="card" style="padding:16px"><b class="num ex" style="font-size:22px">${inr(live().filter(t=>t.a===a.n&&t.v<0&&!t.tr).reduce((s,t)=>s+t.v,0))}</b></div>`))}
function editBal(i){sheet(`<b style="font-size:18px">${accts[i].n} balance</b><small class="cap">Changing it adds an adjustment record. It won't count as spending.</small><div class="f"><input id="nb" class="num" inputmode="numeric" value="${accts[i].b}"></div><button class="btn" onclick="const n=+$('#nb').value,d=n-accts[${i}].b;accts[${i}].b=n;closeSh();pages.length&&pop();go(tab,1);snack('Adjustment '+(d>=0?'+':'−')+inr(d)+' recorded')">Save balance</button>`)}
function budPg(i){const b=budgets[i],p=b.s/b.l*100;push(pg(b.c+' budget',`<div class="card" style="padding:18px"><div class="num cu" data-n="${b.l-b.s}" style="font-size:36px;font-weight:800">0</div><small>left of ${inr(b.l)} this month</small><div class="bar" style="margin-top:14px"><i class="${p>=100?'d':p>=75?'w':''}" data-w="${Math.min(p,100)}"></i></div></div><h3>Alerts</h3><div class="card">${[75,90,100].map(x=>`<div class="row" style="cursor:default"><span class="ic">${p>=x?'✅':'⏳'}</span><div class="t"><b>${x}% reached</b><small>${p>=x?'Notified once this period':'Not triggered yet'}</small></div></div>`).join('')}</div><button class="btn r" style="margin-top:20px" onclick="pop();const x=budgets.splice(${i},1)[0];go(tab,1);snack('Budget deleted',()=>{budgets.splice(${i},0,x);go(tab,1)})">Delete budget</button>`))}
function newBud(){push(pg('New budget',`<div class="f"><label>Category</label><select id="bc">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="f"><label>Period</label><select><option>Weekly</option><option selected>Monthly</option><option>Yearly</option><option>Custom</option></select></div><div class="f"><label>Limit</label><input id="bl" class="amt num" inputmode="numeric" placeholder="₹0"></div><button class="btn" onclick="const l=+$('#bl').value;if(!l)return;budgets.push({c:$('#bc').value,s:0,l});pop();snack('Budget created')">Create budget</button>`,'',1))}
/* recurring */
function recPg(){const body=()=>`<div class="card">${rec.map((r,i)=>`<div class="row" onclick="recAct(${i})"><span class="ic">🔁</span><div class="t"><b>${r.n}</b><small>${r.f} · ${r.due}</small></div><b class="num">${inr(r.v)}</b></div>`).join('')}</div><p class="cap">Tap one to see the reminder you'll get.</p><button class="btn g" onclick="recAdd()">+ Add recurring payment</button>`;push(pg('Recurring',body()))}
function recAct(i){const r=rec[i];sheet(`<div style="text-align:center;margin-bottom:16px"><div class="ic" style="margin:0 auto 10px;width:56px;height:56px;font-size:26px">🔔</div><b style="font-size:18px">${r.n} is due</b><br><small>${inr(r.v)} · ${r.due.toLowerCase()}</small></div><div style="display:grid;gap:10px"><button class="btn" onclick="closeSh();snack('Marked paid')">Paid</button><button class="btn g" onclick="closeSh();snack('Reminding you later')">Later</button><button class="btn g" onclick="closeSh();snack('Reminder off for this one')">Don't remind</button><button class="btn r" onclick="closeSh();const x=rec.splice(${i},1)[0];go(tab,1);snack('Autopay removed',()=>{rec.splice(${i},0,x);go(tab,1)})">Delete</button></div>`)}
function recAdd(){sheet(`<b style="font-size:18px">Recurring payment</b><div class="f" style="margin-top:14px"><input id="rn" placeholder="Name"></div><div class="f"><input id="rv" class="num" inputmode="numeric" placeholder="Amount"></div><div class="f"><select><option>Monthly</option><option>Weekly</option><option>Yearly</option></select></div><button class="btn" onclick="const v=+$('#rv').value;if(!v)return;rec.push({n:$('#rn').value||'Payment',v,f:'Monthly',due:'In 30 days'});closeSh();pop();recPg()">Save</button>`)}
/* sms */
function smsPg(){push(pg('SMS detection',smsBody()))}
function smsBody(){const L=smsTab==='Detected'?sms:smsTab==='Added'?smsDone:smsIgn;return`<div class="tabs">${['Detected','Added','Ignored'].map(x=>`<button class="chip ${smsTab===x?'on':''}" onclick="smsTab='${x}';bdy().innerHTML=smsBody()">${x}</button>`).join('')}</div>${L.length?L.map((s,i)=>`<div class="card" style="padding:16px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center"><b class="num" style="font-size:22px">${inr(s.v)}</b><small style="font-weight:700;color:var(--${s.st==='Failed'?'ex':'in'})">${s.st}</small></div><div style="margin:4px 0 8px">${s.w} · ${s.pm} · ${s.a}</div><small>Original SMS: Rs.${s.v} debited from A/c XX4821 to ${s.w}. UPI Ref 4093…</small>${smsTab==='Detected'?`<div style="display:flex;gap:8px;margin-top:14px"><button class="btn g" style="padding:12px" onclick="smsIgn.push(sms.splice(${i},1)[0]);bdy().innerHTML=smsBody()">Ignore</button><button class="btn g" style="padding:12px" onclick="addPg('Expense',{v:-${s.v},w:'${s.w}'})">Edit</button>${s.st==='Failed'?'':`<button class="btn" style="padding:12px" onclick="const s=sms.splice(${i},1)[0];smsDone.push(s);tx.unshift({id:nid++,w:s.w,c:'Shopping',pm:s.pm,a:s.a,v:-s.v,d:'Today',ago:0,sms:1});bdy().innerHTML=smsBody();snack('Added to transactions')">Add</button>`}</div>`:''}</div>`).join(''):'<p class="cap" style="text-align:center;padding:40px 0">Nothing here yet.<br>New bank messages will appear in Detected.</p>'}`}
/* receipts / deleted */
function rcptPg(){const m=['October 2026','September 2026'];push(pg('Receipts',m.map((x,i)=>`<div class="day">${x}</div><div class="grid">${'<span class="th" onclick="rcView()"></span>'.repeat(i?5:3)}</div>`).join('')))}
function rcView(){sheet(`<div class="map" style="height:200px;font-size:13px;color:var(--mut)">Full-size receipt</div><div class="card"><div class="row" style="cursor:default"><small style="width:100px">Amount</small><b class="num">₹450</b></div><div class="row" style="cursor:default"><small style="width:100px">Category</small><b>Food</b></div><div class="row" style="cursor:default"><small style="width:100px">Date</small><b>Today</b></div></div><button class="btn" style="margin-top:14px" onclick="closeSh()">View expense</button>`)}
function delPg(){const b=()=>{const d=tx.filter(t=>t.del);return d.length?`<div class="card">${d.map(t=>`<div class="row" style="cursor:default"><span class="ic">${CI[t.c]||'•'}</span><div class="t"><b>${t.w}</b><small>${inr(t.v)}</small></div><button class="chip on" onclick="tx.find(x=>x.id==${t.id}).del=0;bdy().innerHTML=(${b})()">Restore</button></div>`).join('')}</div>`:'<p class="cap" style="text-align:center;padding:60px 0">Nothing deleted.<br>Deleted transactions stay here until you remove them.</p>'};push(pg('Recently deleted',b()))}
/* settings pages */
const tg=(on)=>`<span class="tg ${on?'on':''}" onclick="this.classList.toggle('on')"></span>`;
const R=(i,t,s,r,c)=>`<div class="row" ${c?`onclick="${c}"`:'style="cursor:default"'}><span class="ic">${i}</span><div class="t"><b>${t}</b>${s?`<small>${s}</small>`:''}</div>${r===undefined?'<span class="go">›</span>':r}</div>`;
const C=x=>`<div class="card" style="margin-bottom:14px">${x}</div>`;
function prog(label){sheet(`<b style="font-size:18px">${label}</b><div class="pb"><i id="pi"></i></div><small id="pt">0%</small>`);let p=0;const t=setInterval(()=>{p+=7+Math.random()*9;if(p>=100){p=100;clearInterval(t);setTimeout(()=>{closeSh();snack(label+' complete')},400)}$('#pi').style.width=p+'%';$('#pi').style.transition='width .2s';$('#pt').textContent=Math.round(p)+'%'},180)}
const G={Profile:()=>C(R('👤','Name','Amar','')+R('₹','Currency','INR only','')+R('💳','Default UPI account','SBI',undefined,"sheet('<b>Default UPI account</b><div style=margin-top:12px>'+accts.map(a=>`<button class=&quot;btn g&quot; style=margin-bottom:8px onclick=closeSh()>${a.n}</button>`).join('')+'</div>')")),
Accounts:()=>C(accts.map((a,i)=>R('🏦',a.n,'Tracked balance',`<b class="num">${inr(a.b)}</b>`,`accPg(${i})`)).join(''))+'<button class="btn g" onclick="snack(\'Add account form opens here\')">+ Add bank account</button><p class="cap">Cash is a payment method, not an account.</p>',
Categories:()=>C(cats.map(c=>R(CI[c],c,live().filter(t=>t.c===c).length+' transactions','',`sheet('<b>${c}</b><small class=cap>Pick a replacement category before deleting so no transaction loses its category.</small><select style=margin-bottom:12px>'+'${cats.filter(x=>x!==c).map(x=>`<option>${x}</option>`).join('')}'+'</select><button class=btn onclick=closeSh()>Move and delete</button>')`)).join(''))+'<button class="btn g" onclick="snack(\'New category\')">+ Add category</button><p class="cap">Typing "momos" suggests Food. Rules are learned and stored on this phone.</p>',
Tags:()=>`<div class="chips" style="flex-wrap:wrap;margin:0">${tags.map(t=>`<button class="chip" onclick="this.style.transform='scale(0)';setTimeout(()=>this.remove(),250)">${t} ✕</button>`).join('')}</div><button class="btn g" style="margin-top:14px" onclick="snack('New tag')">+ New tag</button>`,
'Recurring Payments':()=>{recPg()},Receipts:()=>{rcptPg()},'Recently Deleted':()=>{delPg()},'SMS Detection':()=>{smsPg()},
Location:()=>C(R('📍','Capture location on save','Only when you save, never in the background',tg(1))+R('🗺','Save place names','Readable address next to coordinates',tg(1)))+'<p class="cap">Location is never tracked continuously.</p>',
Notifications:()=>C(R('🔁','Recurring payments','',tg(1))+R('📊','Budget 75%','',tg(1))+R('⚠️','Budget 90%','',tg(1))+R('🚫','Budget 100%','',tg(1))+R('💬','SMS awaiting review','',tg(1))),
'Backup & Restore':()=>C(R('💾','Create backup','Database, receipts and settings in one file','',"prog('Backup')")+R('♻️','Restore from backup','Checks version and integrity first','',"snack('Choose a backup file')")+R('🔐','Encrypt backups','',tg(1)))+C(R('☁️','Google Drive','Optional · works fine without it',tg(0)))+'<p class="cap">Last backup: 2 days ago.</p>',
'Import / Export':()=>C(R('⬆️','Export CSV','Written in small batches','',"prog('CSV export')")+R('📄','Export PDF report','Date range, totals and summaries','',"prog('PDF export')")+R('⬇️','Import CSV','Rows checked before saving','',"prog('CSV import')")),
Security:()=>C(R('👆','Biometric lock','Fingerprint or face',tg(1))+R('🔑','Device PIN fallback','Used if biometrics fail','Always on')+R('🔒','Preview lock screen','','',"lockScr()"))+'<p class="cap">MyKhata has no app PIN of its own.</p>',
Appearance:()=>`<div class="seg">${['System','Light','Dark'].map((x,i)=>`<button class="chip ${i==0?'on':''}" onclick="this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===this));const r=document.documentElement;x='${x}'==='System'?r.removeAttribute('data-theme'):r.setAttribute('data-theme','${x.toLowerCase()}')">${x}</button>`).join('')}</div>${C(R('🔤','Follow system font size','',tg(1))+R('✨','Reduce motion','Follows system setting',tg(0)))}`,
About:()=>`<div style="text-align:center;padding:40px 0"><div class="ic" style="width:80px;height:80px;border-radius:28px;font-size:38px;margin:0 auto 14px;background:var(--ac)">📒</div><b style="font-size:22px">MyKhata</b><small class="cap">Version 1.0 · Offline · No ads · No login</small></div>`};
function setPg(n){const r=G[n]();if(r!==undefined)push(pg(n,r))}
/* onboarding & lock */
function onb(s){s=s||1;const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;let b;
if(s==1)b=`<h1>Welcome to MyKhata</h1><p class="cap" style="margin-bottom:18px">Start with your bank account. You can add more later.</p><div class="f"><label>Account name</label><input value="SBI"></div><div class="f"><label>Current balance</label><input class="num" value="50000"></div><button class="btn g" style="margin-bottom:10px" onclick="snack('Another account added')">+ Add another bank account</button><button class="btn" onclick="onb(2)">Continue</button>`;
else if(s==2)b=`<h1>Permissions</h1><p class="cap">Each one is optional. We only use them for the reason shown.</p>${C([['🔔','Notifications','Budget and payment reminders'],['📍','Location','Saved with an expense, only when you save'],['📷','Camera','Photograph receipts'],['🖼','Photos','Attach receipts from gallery'],['💬','SMS','Detect bank messages for review']].map(x=>R(x[0],x[1],x[2],tg(1))).join(''))}<button class="btn" onclick="onb(3)">Continue</button>`;
else b=`<h1>Protect your data</h1><p class="cap" style="margin-bottom:30px">Use your fingerprint or face to open MyKhata. If that fails, your phone's PIN or pattern works.</p><div class="fp" id="fp" onclick="this.classList.add('ok');this.textContent='✓';setTimeout(()=>{closeOv();go('Home')},700)">👆</div><p class="cap" style="text-align:center;margin:16px 0 30px">Tap to turn on biometric lock</p><button class="btn g" onclick="closeOv();go('Home')">Skip for now</button>`;
$('#ov').innerHTML=`<div class="pg in" style="z-index:20"><div class="bd" style="padding-top:30px"><div class="step">${dots}${b}</div></div></div>`}
function closeOv(){$('#ov').innerHTML=''}
function lockScr(){$('#ov').innerHTML=`<div class="pg in" style="z-index:20;justify-content:center"><div class="bd" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="ic" style="width:70px;height:70px;border-radius:24px;font-size:34px;margin:0 auto 12px;background:var(--ac)">📒</div><h1 style="margin:0">MyKhata</h1><small class="cap" style="margin-bottom:40px">Locked</small><div class="fp" onclick="this.classList.add('ok');this.textContent='✓';setTimeout(closeOv,600)">👆</div><p class="cap" style="margin-top:16px">Touch the sensor<br><a style="color:var(--ac);font-weight:600" onclick="closeOv()">Use device PIN</a></p></div></div>`}
go('Home');onb(1);
</script></body></html>
